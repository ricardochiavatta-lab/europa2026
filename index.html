<style>
  :root {
    --bg: #0f0f1a;
    --bg2: #1a1a2e;
    --bg3: #16213e;
    --accent: #e8c97a;
    --accent2: #c4a35a;
    --text: #f0ece0;
    --text2: #a09880;
    --red: #e07070;
    --green: #70c490;
    --border: rgba(232,201,122,0.15);
    --card: rgba(255,255,255,0.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 20%, rgba(232,201,122,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(70,100,180,0.08) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .screen { display: none; min-height: 100vh; position: relative; z-index: 1; }
  .screen.active { display: flex; flex-direction: column; }

  /* ── HEADER ── */
  .header {
    padding: 52px 24px 20px;
    background: linear-gradient(180deg, rgba(26,26,46,0.95) 0%, transparent 100%);
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(12px);
  }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .header-city {
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .header-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.1;
  }
  .header-date {
    font-size: 12px;
    color: var(--text2);
    margin-top: 4px;
  }
  .settings-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    cursor: pointer;
    color: var(--accent);
    font-size: 18px;
    transition: all 0.2s;
  }
  .settings-btn:active { transform: scale(0.94); }

  /* ── SALDO CARD ── */
  .saldo-section { padding: 0 24px 24px; }
  .saldo-card {
    background: linear-gradient(135deg, rgba(232,201,122,0.12) 0%, rgba(232,201,122,0.04) 100%);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .saldo-card::before {
    content: '€';
    position: absolute;
    right: -10px; top: -20px;
    font-family: 'Playfair Display', serif;
    font-size: 120px;
    color: rgba(232,201,122,0.06);
    line-height: 1;
    pointer-events: none;
  }
  .saldo-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; }
  .saldo-valor {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .saldo-total { font-size: 12px; color: var(--text2); margin-top: 6px; }
  .saldo-bar-wrap { margin-top: 16px; }
  .saldo-bar-bg { background: rgba(255,255,255,0.08); border-radius: 99px; height: 6px; overflow: hidden; }
  .saldo-bar { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width 0.6s ease; }
  .saldo-bar-labels { display: flex; justify-content: space-between; margin-top: 6px; }
  .saldo-bar-labels span { font-size: 11px; color: var(--text2); }

  /* ── DIÁRIA ── */
  .diaria-row {
    display: flex; gap: 12px; padding: 0 24px 20px;
  }
  .diaria-card {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
  }
  .diaria-card .label { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text2); margin-bottom: 6px; }
  .diaria-card .valor { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; }
  .diaria-card .valor.ok { color: var(--green); }
  .diaria-card .valor.warn { color: var(--accent); }
  .diaria-card .valor.danger { color: var(--red); }
  .diaria-card .sub { font-size: 10px; color: var(--text2); margin-top: 2px; }

  /* ── REGISTRO GASTO ── */
  .add-section { padding: 0 24px 20px; }
  .add-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #0f0f1a;
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .add-btn:active { transform: scale(0.97); }

  /* ── HISTÓRICO ── */
  .historico-section { padding: 0 24px; flex: 1; }
  .section-title {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 16px;
  }
  .day-group { margin-bottom: 20px; }
  .day-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .day-name { font-size: 13px; font-weight: 500; color: var(--text2); }
  .day-total { font-size: 13px; font-weight: 500; color: var(--accent); }
  .gasto-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;
    position: relative;
  }
  .gasto-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .gasto-info { flex: 1; min-width: 0; }
  .gasto-desc { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gasto-cat { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .gasto-valor { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 700; color: var(--red); }
  .gasto-delete {
    background: rgba(224,112,112,0.12);
    border: 1px solid rgba(224,112,112,0.25);
    border-radius: 8px;
    color: var(--red);
    font-size: 14px;
    cursor: pointer;
    padding: 6px 10px;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .gasto-delete:active { background: rgba(224,112,112,0.3); transform: scale(0.93); }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text2);
    font-size: 13px;
    line-height: 1.6;
  }
  .empty-state .emoji { font-size: 32px; margin-bottom: 12px; }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: sticky; bottom: 0;
    background: rgba(15,15,26,0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 12px 0 28px;
    z-index: 10;
  }
  .nav-item {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer;
    padding: 8px 0;
    transition: all 0.2s;
    color: var(--text2);
    font-size: 10px;
    letter-spacing: 0.5px;
    border: none; background: none;
  }
  .nav-item .nav-icon { font-size: 22px; transition: transform 0.2s; }
  .nav-item.active { color: var(--accent); }
  .nav-item.active .nav-icon { transform: translateY(-2px); }

  /* ── MODAL GASTO ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal {

<script>
// ── ESTADO ──────────────────────────────────────────────────────────────
const STORAGE_KEY = 'europa2026_data';

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return {
    totalEuros: 1350,
    dataInicio: '2026-06-20',
    dataFim: '2026-07-03',
    gastos: []
  };
}

function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
}

let state = loadData();

// ── NAVEGAÇÃO ────────────────────────────────────────────────────────────
function goTo(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + screen).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => {
    if (n.getAttribute('onclick') && n.getAttribute('onclick').includes(screen)) {
      n.classList.add('active');
    }
  });
  if (screen === 'home') renderHome();
  if (screen === 'resumo') renderResumo();
  if (screen === 'settings') renderSettings();
  window.scrollTo(0, 0);
}

// ── UTILIDADES ───────────────────────────────────────────────────────────
function hoje() {
  return new Date().toISOString().split('T')[0];
}

function formatDate(dateStr) {
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}`;
}

function formatDateFull(dateStr) {
  const days = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const months = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return `${days[dt.getDay()]}, ${d} ${months[m-1]}`;
}

function diasRestantes() {
  const hoje_d = new Date(hoje());
  const fim_d = new Date(state.dataFim);
  const diff = Math.ceil((fim_d - hoje_d) / (1000*60*60*24)) + 1;
  return Math.max(0, diff);
}

function totalGasto() {
  return state.gastos.reduce((s, g) => s + g.valor, 0);
}

function gastoHoje() {
  const h = hoje();
  return state.gastos.filter(g => g.data === h).reduce((s, g) => s + g.valor, 0);
}

function saldoAtual() {
  return state.totalEuros - totalGasto();
}

function mediaRecomendada() {
  const dias = diasRestantes();
  if (dias <= 0) return saldoAtual();
  return saldoAtual() / dias;
}

function cidadeAtual() {
  const h = hoje();
  if (h >= '2026-06-20' && h <= '2026-06-23') return 'Roma 🇮🇹';
  if (h >= '2026-06-24' && h <= '2026-06-28') return 'Paris 🇫🇷';
  if (h >= '2026-06-29' && h <= '2026-07-03') return 'Amsterdã 🇳🇱';
  return 'Europa ✈️';
}

function catIcon(cat) {
  const icons = { 'Alimentação':'🍽️','Transporte':'🚇','Ingressos':'🎟️','Hospedagem':'🏨','Compras':'🛍️','Outros':'💰' };
  return icons[cat] || '💰';
}

function catColor(cat) {
  const colors = {
    'Alimentação':'rgba(130,200,130,0.15)',
    'Transporte':'rgba(130,160,220,0.15)',
    'Ingressos':'rgba(200,150,220,0.15)',
    'Hospedagem':'rgba(220,180,100,0.15)',
    'Compras':'rgba(220,130,130,0.15)',
    'Outros':'rgba(150,150,150,0.15)'
  };
  return colors[cat] || 'rgba(150,150,150,0.15)';
}

// ── RENDER HOME ──────────────────────────────────────────────────────────
function renderHome() {
  const saldo = saldoAtual();
  const total = state.totalEuros;
  const media = mediaRecomendada();
  const dias = diasRestantes();
  const gh = gastoHoje();
  const pct = Math.min(100, Math.max(0, (saldo / total) * 100));

  document.getElementById('current-city').textContent = cidadeAtual();
  document.getElementById('current-date').textContent = formatDateFull(hoje());
  document.getElementById('saldo-display').textContent = `€${saldo.toFixed(2)}`;
  document.getElementById('saldo-total-display').textContent = `de €${total.toFixed(2)} totais · gasto €${totalGasto().toFixed(2)}`;
  document.getElementById('saldo-bar').style.width = pct + '%';
  document.getElementById('saldo-bar-max').textContent = `€${total}`;

  const mediaEl = document.getElementById('media-recomendada');
  mediaEl.textContent = `€${media.toFixed(0)}`;
  mediaEl.className = 'valor ' + (media >= 70 ? 'ok' : media >= 40 ? 'warn' : 'danger');

  const hojeEl = document.getElementById('gasto-hoje');
  hojeEl.textContent = `€${gh.toFixed(2)}`;
  const mediaHoje = dias > 0 ? saldo / dias : 0;
  hojeEl.className = 'valor ' + (gh <= mediaHoje ? 'ok' : gh <= mediaHoje * 1.3 ? 'warn' : 'danger');

  document.getElementById('dias-restantes').textContent = dias;

  renderHistorico();
}

function renderHistorico() {
  const list = document.getElementById('historico-list');

  if (state.gastos.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="emoji">✈️</div>Nenhum gasto registrado ainda.<br>Aproveite a viagem!</div>`;
    return;
  }

  // Agrupa por data
  const byDate = {};
  [...state.gastos].sort((a,b) => b.data.localeCompare(a.data)).forEach(g => {
    if (!byDate[g.data]) byDate[g.data] = [];
    byDate[g.data].push(g);
  });

  list.innerHTML = Object.entries(byDate).map(([date, gastos]) => {
    const total = gastos.reduce((s,g) => s+g.valor, 0);
    const itens = gastos.map(g => `
      <div class="gasto-item">
        <div class="gasto-icon" style="background:${catColor(g.cat)}">${catIcon(g.cat)}</div>
        <div class="gasto-info">
          <div class="gasto-desc">${g.desc || g.cat}</div>
          <div class="gasto-cat">${g.cat} · ${g.cidade || ''}</div>
        </div>
        <div class="gasto-valor">-€${g.valor.toFixed(2)}</div>
        <button class="gasto-delete" onclick="deletarGasto('${g.id}')">✕</button>
      </div>
    `).join('');
    return `
      <div class="day-group">
        <div class="day-header">
          <span class="day-name">${formatDateFull(date)}</span>
          <span class="day-total">-€${total.toFixed(2)}</span>
        </div>
        ${itens}
      </div>
    `;
  }).join('');
}

// ── RENDER RESUMO ────────────────────────────────────────────────────────
function renderResumo() {
  const cidades = [
    { nome: 'Roma 🇮🇹', inicio: '2026-06-20', fim: '2026-06-23' },
    { nome: 'Paris 🇫🇷', inicio: '2026-06-24', fim: '2026-06-28' },
    { nome: 'Amsterdã 🇳🇱', inicio: '2026-06-29', fim: '2026-07-03' },
  ];
  const cats = ['Alimentação','Transporte','Ingressos','Hospedagem','Compras'];

  const content = document.getElementById('resumo-content');

  // Total geral por categoria
  const totalCat = {};
  cats.forEach(c => totalCat[c] = 0);
  state.gastos.forEach(g => { totalCat[g.cat] = (totalCat[g.cat]||0) + g.valor; });

  let html = '';

  // Card geral
  const total = totalGasto();
  html += `
    <div class="resumo-city-card">
      <div class="resumo-city-header">
        <span class="resumo-city-name">Geral</span>
        <span class="resumo-city-total">-€${total.toFixed(2)}</span>
      </div>
      ${cats.map(c => totalCat[c] > 0 ? `
        <div class="cat-row">
          <span class="cat-row-left">${catIcon(c)} ${c}</span>
          <span class="cat-row-val">€${totalCat[c].toFixed(2)}</span>
        </div>
      ` : '').join('')}
      ${total === 0 ? '<div style="text-align:center;color:var(--text2);font-size:13px;padding:16px">Nenhum gasto ainda</div>' : ''}
    </div>
  `;

  // Por cidade
  cidades.forEach(cidade => {
    const gastosCidade = state.gastos.filter(g => g.cidade === cidade.nome.split(' ')[0]);
    const totalCidade = gastosCidade.reduce((s,g) => s+g.valor, 0);
    const catCidade = {};
    gastosCidade.forEach(g => { catCidade[g.cat] = (catCidade[g.cat]||0) + g.valor; });

    html += `
      <div class="resumo-city-card">
        <div class="resumo-city-header">
          <span class="resumo-city-name">${cidade.nome}</span>
          <span class="resumo-city-total">-€${totalCidade.toFixed(2)}</span>
        </div>
        ${cats.map(c => catCidade[c] > 0 ? `
          <div class="cat-row">
            <span class="cat-row-left">${catIcon(c)} ${c}</span>
            <span class="cat-row-val">€${catCidade[c].toFixed(2)}</span>
          </div>
        ` : '').join('')}
        ${totalCidade === 0 ? `<div style="text-align:center;color:var(--text2);font-size:13px;padding:8px">Nenhum gasto em ${cidade.nome.split(' ')[0]}</div>` : ''}
      </div>
    `;
  });

  content.innerHTML = html;
}

// ── RENDER SETTINGS ──────────────────────────────────────────────────────
function renderSettings() {
  document.getElementById('cfg-total-display').textContent = `€${state.totalEuros}`;
  document.getElementById('cfg-inicio-display').textContent = formatDate(state.dataInicio);
  document.getElementById('cfg-fim-display').textContent = formatDate(state.dataFim);
  document.getElementById('input-inicio').value = state.dataInicio;
  document.getElementById('input-fim').value = state.dataFim;
  document.getElementById('input-euros').value = state.totalEuros;
}

// ── MODAL ────────────────────────────────────────────────────────────────
let catSelecionada = null;
let cidadeSelecionada = null;

function openModal() {
  document.getElementById('modal-gasto').classList.add('open');
  document.getElementById('input-valor').value = '';
  document.getElementById('input-desc').value = '';
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  catSelecionada = null;
  cidadeSelecionada = null;
  // Auto-seleciona cidade pelo dia atual
  const c = cidadeAtualSimples();
  if (c) {
    const btn = document.querySelector(`.cat-btn[data-cidade="${c}"]`);
    if (btn) { btn.classList.add('selected'); cidadeSelecionada = c; }
  }
  setTimeout(() => document.getElementById('input-valor').focus(), 300);
}

function closeModal() {
  document.getElementById('modal-gasto').classList.remove('open');
}

function selectCat(btn) {
  document.querySelectorAll('.cat-btn[data-cat]').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  catSelecionada = btn.dataset.cat;
}

function selectCidade(btn) {
  document.querySelectorAll('.cat-btn[data-cidade]').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  cidadeSelecionada = btn.dataset.cidade;
}

function cidadeAtualSimples() {
  const h = hoje();
  if (h >= '2026-06-20' && h <= '2026-06-23') return 'Roma';
  if (h >= '2026-06-24' && h <= '2026-06-28') return 'Paris';
  if (h >= '2026-06-29' && h <= '2026-07-03') return 'Amsterdã';
  return null;
}

document.getElementById('modal-gasto').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ── AÇÕES ────────────────────────────────────────────────────────────────
function registrarGasto() {
  const valor = parseFloat(document.getElementById('input-valor').value);
  if (!valor || valor <= 0) { alert('Informe o valor do gasto.'); return; }
  if (!catSelecionada) { alert('Selecione uma categoria.'); return; }
  if (!cidadeSelecionada) { alert('Selecione a cidade.'); return; }

  const desc = document.getElementById('input-desc').value.trim();
  const gasto = {
    id: Date.now().toString(),
    valor,
    cat: catSelecionada,
    cidade: cidadeSelecionada,
    desc,
    data: hoje(),
    hora: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'})
  };

  state.gastos.push(gasto);
  saveData(state);
  closeModal();
  renderHome();
}

function deletarGasto(id) {
  if (!confirm('Remover este gasto?')) return;
  state.gastos = state.gastos.filter(g => g.id !== id);
  saveData(state);
  renderHome();
}

function salvarEuros() {
  const val = parseFloat(document.getElementById('input-euros').value);
  if (!val || val <= 0) { alert('Informe um valor válido.'); return; }
  state.totalEuros = val;
  saveData(state);
  renderSettings();
  alert('✓ Saldo atualizado!');
}

function salvarDatas() {
  const inicio = document.getElementById('input-inicio').value;
  const fim = document.getElementById('input-fim').value;
  if (!inicio || !fim) { alert('Informe as duas datas.'); return; }
  if (inicio > fim) { alert('Data de início deve ser antes do fim.'); return; }
  state.dataInicio = inicio;
  state.dataFim = fim;
  saveData(state);
  renderSettings();
  alert('✓ Datas salvas!');
}

function confirmarReset() {
  if (confirm('Tem certeza? Todos os gastos serão apagados.')) {
    state.gastos = [];
    saveData(state);
    renderHome();
    goTo('home');
    alert('✓ Gastos apagados.');
  }
}

// ── INIT ─────────────────────────────────────────────────────────────────
renderHome();
</script>

<script>
if ('serviceWorker' in navigator) {
  // Inline Service Worker via Blob para funcionar sem servidor separado
  const swCode = `
    const CACHE = 'europa2026-v1';
    self.addEventListener('install', e => {
      e.waitUntil(
        caches.open(CACHE).then(cache => cache.add('/'))
      );
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(cached => {
          return cached || fetch(e.request).then(response => {
            return caches.open(CACHE).then(cache => {
              cache.put(e.request, response.clone());
              return response;
            });
          }).catch(() => cached);
        })
      );
    });
  `;
  const blob = new Blob([swCode], {type: 'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
</script>
